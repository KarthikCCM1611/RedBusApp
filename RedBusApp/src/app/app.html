<div class="parent">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-glass">
        <div class="container">
            <a class="navbar-brand fw-bold gradient-text" routerLink="/home"><i class="fa-solid fa-bus"></i> GoBus</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span
                    class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" routerLink="/home">Home</a></li>
                    @if (!authSrc.email() || authSrc.email() === "") {
                    <li class="nav-item" data-show="guest"><a class="nav-link" routerLink="/register">Register</a></li>
                    <li class="nav-item" data-show="guest"><a class="nav-link" routerLink="/login">Login</a></li>
                    }
                    @else if (authSrc.email()) {
                    @if(authSrc.isAdmin()) {
                    <li class="nav-item" data-show="admin"><a class="nav-link" routerLink="/admin-dashboard">Admin</a>
                    </li>
                    }
                    @else {
                    <li class="nav-item" data-show="user"><a class="nav-link" routerLink="/my-bookings">My Bookings</a>
                    </li>
                    }
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                            {{ authSrc.email() | uppercase }}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" (click)="logout()">Logout</a></li>
                        </ul>
                    </li>
                    }
                    <li class="nav-item ms-lg-3"><button class="btn btn-sm themeToggle theme-toggle" type="button"
                            (click)="toggleTheme()">
                            @if(currentTheme() === 'Dark') {
                            <i class="fa-solid fa-sun me-1"></i> Light
                            }
                            @else {
                            <i class="fa-solid fa-moon me-1"></i> Dark
                            }
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>
<router-outlet />
